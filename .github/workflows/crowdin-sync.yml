name: Crowdin — Sync Translations

on:
  schedule:
    # Jeden Tag um 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download translations from Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          localization_branch_name: l10n/translations
          create_pull_request: true
          pull_request_title: 'chore: update translations from Crowdin'
          pull_request_body: 'Automated translation update from [Crowdin](https://crowdin.com/project/playnite-duplicate-hider-ng).'
          pull_request_base_branch_name: master
          crowdin_branch_name: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
